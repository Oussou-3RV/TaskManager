spring.application.name=backend

# Base de donnees PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/orchestration}
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD:secret}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Variables custom
jwt.secret=${JWT_SECRET:change-me-in-production-super-secret-key-256bits}
placement.service.url=${PLACEMENT_SERVICE_URL:http://localhost:8000}
