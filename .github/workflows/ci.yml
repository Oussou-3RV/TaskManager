name: CI

# Se declenche a chaque push et sur chaque pull request, sur n'importe
# quelle branche - c'est ca qui donne le "auto" de l'integration continue :
# aucune commande a taper, GitHub lance tout tout seul.
on:
  push:
  pull_request:

jobs:
  # Reutilise exactement ce qu'on lance deja en local avec ./mvnw verify :
  # tests unitaires, tests d'integration (Testcontainers - Docker est deja
  # installe sur les machines GitHub) et verification du seuil de couverture
  # de 75% (JaCoCo). Si un seul test casse ou que la couverture descend
  # sous 75%, ce job echoue et GitHub affiche une croix rouge sur le commit.
  backend-tests:
    runs-on: ubuntu-latest
    # BackendApplicationTests (test preexistant, pas Testcontainers) se
    # connecte a un vrai Postgres sur localhost:5432, comme en local quand on
    # lance "docker compose up -d db" avant ./mvnw test. Ce service recree la
    # meme situation pour la duree du job.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: orchestration
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: secret
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U admin -d orchestration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Le healthcheck du service Postgres dit "pret", mais il arrive que le
      # port ne soit pas encore vraiment joignable depuis l'exterieur du
      # conteneur au meme instant (fragilite connue de GitHub Actions).
      # Cette attente active evite le "Connection refused" en debut de job.
      - name: Attendre que Postgres soit vraiment joignable
        run: |
          for i in $(seq 1 20); do
            if (echo > /dev/tcp/localhost/5432) 2>/dev/null; then
              echo "Postgres joignable."
              exit 0
            fi
            echo "Postgres pas encore joignable, tentative $i..."
            sleep 2
          done
          echo "Timeout en attendant Postgres."
          exit 1

      - name: Tests unitaires + integration + couverture (seuil 75%)
        working-directory: backend
        run: ./mvnw verify

      - name: Publier le rapport de couverture JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: backend/target/site/jacoco/

  # Demarre la vraie stack Docker (comme docker compose up en local) et
  # rejoue les 5 scenarios Playwright dedans, dans un vrai navigateur.
  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparer la configuration
        run: cp .env.example .env

      - name: Demarrer la stack complete (db, placement, backend, frontend)
        run: docker compose up -d --build

      - name: Attendre que le backend soit pret
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null; then
              echo "Backend pret."
              exit 0
            fi
            sleep 5
          done
          echo "Le backend n'a pas repondu a temps."
          docker compose logs backend
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dependances frontend
        working-directory: frontend
        run: npm ci

      - name: Installer le navigateur Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Lancer les tests de bout en bout
        working-directory: frontend
        run: npm run test:e2e

      - name: Publier le rapport Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/

      - name: Logs des conteneurs (utile seulement si le job echoue)
        if: failure()
        run: docker compose logs
