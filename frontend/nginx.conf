server {
    listen 80;
    listen [::]:80;
    root /usr/share/nginx/html;
    index index.html;

    # Sert le fichier demande s'il existe (JS, CSS, /health...), sinon
    # renvoie index.html pour laisser Vue Router gerer la route cote
    # navigateur (ex: /tasks, /rules apres un rafraichissement de page).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
